name: Sign

on:
    workflow_call:
        inputs:
            artifact_suffix:
                required: false
                type: string
                default: ""
                description: "Suffix of the artifact names"
        secrets:
            SIGNSERVER_TOKEN:
                required: true

jobs:
    sign:
        name: Sign (${{ matrix.target.artifact }})
        runs-on: ubuntu-latest
        environment: ReleaseEnv
        strategy:
            matrix:
                target:
                    - {
                          artifact: SISR-linux_x64,
                          goos: linux,
                          binary: SISR,
                          archive: "SISR-linux_x64${{ inputs.artifact_suffix }}.tar.gz",
                      }
                    - {
                          artifact: SISR-linux_arm64,
                          goos: linux,
                          binary: SISR,
                          archive: "SISR-linux_arm64${{ inputs.artifact_suffix }}.tar.gz",
                      }
                    - {
                          artifact: SISR-linux_x64-AppImage,
                          goos: linux,
                          binary: SISR-x86_64.AppImage,
                          archive: "",
                      }
                    - {
                          artifact: SISR-linux_arm64-AppImage,
                          goos: linux,
                          binary: SISR-aarch64.AppImage,
                          archive: "",
                      }
                    - {
                          artifact: SISR-windows_x64,
                          goos: windows,
                          binary: SISR.exe,
                          archive: "SISR-windows_x64${{ inputs.artifact_suffix }}.zip",
                      }
        defaults:
            run:
                working-directory: artifact
        env:
            SIGNSERVER: https://signproxy.1-3-3-7.dev/api/v1/sign
            BINARY: ${{ matrix.target.binary }}
            ARCHIVE: ${{ matrix.target.archive }}
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v8.0.1
              with:
                  name: ${{ matrix.target.artifact }}${{ inputs.artifact_suffix }}
                  path: artifact

            - name: Extract binary from archive
              if: ${{ matrix.target.goos == 'windows' && matrix.target.archive != '' }}
              run: unzip "$ARCHIVE" "$BINARY"

            - name: Extract binary from tarball
              if: ${{ matrix.target.goos == 'linux' && matrix.target.archive != '' }}
              run: tar -xzf "$ARCHIVE" "./$BINARY"

            - name: Sign Windows PE
              if: ${{ matrix.target.goos == 'windows' }}
              env:
                  SIGNSERVER_TOKEN: ${{ secrets.SIGNSERVER_TOKEN }}
              run: |
                  curl --fail -H "Authorization: Bearer $SIGNSERVER_TOKEN" -F "files=@$BINARY" -o signed.zip "$SIGNSERVER/binary"
                  unzip -o signed.zip "$BINARY"
                  rm signed.zip

            - name: Sign SHA256SUMS
              if: ${{ matrix.target.goos == 'linux' }}
              env:
                  SIGNSERVER_TOKEN: ${{ secrets.SIGNSERVER_TOKEN }}
              run: |
                  sha256sum "$BINARY" > SHA256SUMS
                  curl --fail -H "Authorization: Bearer $SIGNSERVER_TOKEN" -F "sha256sums=@SHA256SUMS" -o SHA256SUMS.p7 "$SIGNSERVER/sha256sums"

            - name: Wrap signature in CMS ContentInfo
              if: ${{ matrix.target.goos == 'linux' }}
              run: |
                  # SEQUENCE { OID signedData, [0] <SignedData from the server> }
                  size=$(stat -c %s SHA256SUMS.p7)
                  { printf '3082%04X06092A864886F70D010702A082%04X' $((size + 15)) "$size" | basenc --base16 -d; cat SHA256SUMS.p7; } > content-info.der
                  mv content-info.der SHA256SUMS.p7
                  openssl cms -verify -binary -purpose any -inform DER -in SHA256SUMS.p7 -content SHA256SUMS -out /dev/null

            - name: Prefix SHA256SUMS with binary name
              if: ${{ matrix.target.goos == 'linux' && matrix.target.archive == '' }}
              run: |
                  mv SHA256SUMS "$BINARY.SHA256SUMS"
                  mv SHA256SUMS.p7 "$BINARY.SHA256SUMS.p7"

            - name: Move signed binary into archive
              if: ${{ matrix.target.goos == 'windows' && matrix.target.archive != '' }}
              run: zip --move "$ARCHIVE" "$BINARY"

            - name: Move SHA256SUMS into tarball
              if: ${{ matrix.target.goos == 'linux' && matrix.target.archive != '' }}
              run: |
                  gunzip "$ARCHIVE"
                  tar -rf "${ARCHIVE%.gz}" ./SHA256SUMS ./SHA256SUMS.p7
                  gzip "${ARCHIVE%.gz}"
                  rm "$BINARY" SHA256SUMS SHA256SUMS.p7

            - name: Upload signed artifact
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: ${{ matrix.target.artifact }}${{ inputs.artifact_suffix }}
                  path: artifact
                  overwrite: true
                  if-no-files-found: error

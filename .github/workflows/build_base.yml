name: SISR Build Base

on:
    workflow_call:
        inputs:
            artifact_suffix:
                required: false
                type: string
                default: ""
                description: "Suffix to add to artifact names"
            upload_artifacts:
                required: false
                type: boolean
                default: false
                description: "Whether to upload build artifacts"

jobs:
    build:
        name: Build binaries (${{ matrix.target.name }})
        runs-on: ${{ matrix.target.os }}
        strategy:
            fail-fast: false
            matrix:
                target:
                    - {
                          name: "windows_x64",
                          os: "windows-latest",
                          goos: "windows",
                          goarch: "amd64",
                          ext: ".exe",
                      }
                    - {
                          name: "linux_x64",
                          os: "ubuntu-latest",
                          goos: "linux",
                          goarch: "amd64",
                          ext: "",
                      }
                    - {
                          name: "linux_arm64",
                          os: "ubuntu-24.04-arm",
                          goos: "linux",
                          goarch: "arm64",
                          ext: "",
                      }

        steps:
            - name: Disable git autocrlf
              run: |
                  git config --global core.autocrlf false
                  git config --global core.eol lf

            - name: Checkout
              uses: actions/checkout@v6.0.2
              with:
                  fetch-depth: 0
                  submodules: recursive

            - name: Setup Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: stable
                  cache: true
                  cache-dependency-path: go.sum

            - name: Setup Node
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: "25"
                  cache: npm
                  cache-dependency-path: |
                      cefpayloads/package-lock.json
                      UI/package-lock.json

            - name: CEF deps
              working-directory: cefpayloads
              run: npm ci

            - name: CEF build
              working-directory: cefpayloads
              run: npm run build

            - name: UI deps
              working-directory: UI
              run: npm ci

            - name: UI build
              working-directory: UI
              env:
                  PUBLIC_DEV: "0"
                  PUBLIC_LOG_LEVEL: "info"
              run: npm run build

            - name: Install build tools
              if: matrix.target.os == 'ubuntu-latest' || matrix.target.os == 'ubuntu-24.04-arm'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential ninja-build cmake pkg-config \
                      libwebkitgtk-6.0-dev libgtk-4-dev libx11-dev \
                      libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
                      libxss-dev libxtst-dev libxkbcommon-dev

            - name: Install build tools
              if: matrix.target.os == 'windows-latest'
              shell: pwsh
              run: |
                  function Install-Tool($id) {
                      winget install -e --id $id --accept-package-agreements --accept-source-agreements --disable-interactivity
                      if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq -1978335189 -or $LASTEXITCODE -eq -1978335212) {
                          $global:LASTEXITCODE = 0
                      } else {
                          throw "winget install $id failed with exit code $LASTEXITCODE"
                      }
                  }
                  Install-Tool MartinStorsjo.LLVM-MinGW.UCRT
                  Install-Tool Kitware.CMake

            - name: Setup just
              uses: extractions/setup-just@v3

            - name: Install goversioninfo
              run: |
                  go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0

            - name: Version
              id: version
              shell: bash
              run: |
                  VERSION=$(git describe --tags --always)
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Lint
              uses: golangci/golangci-lint-action@v9.2.0
              with:
                  version: latest
                  install-mode: goinstall

            - name: Build
              shell: bash
              env:
                  GOOS: ${{ matrix.target.goos }}
                  GOARCH: ${{ matrix.target.goarch }}
                  CGO_ENABLED: "1"
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  just build Release

            - name: Include VIIPER binary (Windows)
              if: matrix.target.os == 'windows-latest'
              shell: bash
              run: |
                  VIIPER_VERSION=$(grep -E '^\s*github.com/Alia5/VIIPER\s+v[^[:space:]]+' go.mod | awk '{print $2}' | head -n1)
                  if [ -z "$VIIPER_VERSION" ]; then
                    echo "Error: Could not determine VIIPER version from go.mod"
                    exit 1
                  fi

                  # Go pseudo-versions (vX.Y.Z-0.TIMESTAMP-HASH) map to the dev-snapshot release tag
                  VIIPER_TAG="$VIIPER_VERSION"
                  if echo "$VIIPER_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-0\.[0-9]+-[0-9a-f]+$'; then
                    VIIPER_TAG="dev-snapshot"
                  fi

                  VIIPER_ARCH="${{ matrix.target.goarch }}"

                  VIIPER_ASSET="viiper-windows-${VIIPER_ARCH}.zip"
                  VIIPER_URL="https://github.com/Alia5/VIIPER/releases/download/${VIIPER_TAG}/${VIIPER_ASSET}"
                  echo "Downloading VIIPER from: $VIIPER_URL"
                  curl -fsSL "$VIIPER_URL" -o "dist/viiper-windows-${VIIPER_ARCH}.zip"
                  7z e "dist/viiper-windows-${VIIPER_ARCH}.zip" -odist/ viiper.exe -y
                  rm "dist/viiper-windows-${VIIPER_ARCH}.zip"
                  echo "Included VIIPER binary: dist/viiper.exe"

            - name: Build AppImage
              if: matrix.target.os == 'ubuntu-latest' || matrix.target.os == 'ubuntu-24.04-arm'
              shell: bash
              run: |
                  ARCH=$(uname -m)
                  curl -fsSL "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ARCH}.AppImage" -o linuxdeploy
                  chmod +x linuxdeploy
                  export PATH="$PWD:$PATH"
                  ./build_appimage.sh

            - name: Create archive
              shell: bash
              run: |
                  if [ "${{ matrix.target.os }}" = "windows-latest" ]; then
                    cd dist
                    7z a -tzip "SISR-${{ matrix.target.name }}${{ inputs.artifact_suffix }}.zip" *
                    cd ..
                  else
                    tar -C dist --exclude='./appimage' -czf "SISR-${{ matrix.target.name }}${{ inputs.artifact_suffix }}.tar.gz" .
                    mv "SISR-${{ matrix.target.name }}${{ inputs.artifact_suffix }}.tar.gz" dist/
                  fi

            - name: Upload artifact
              if: ${{ inputs.upload_artifacts }}
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: SISR-${{ matrix.target.name }}${{ inputs.artifact_suffix }}
                  path: |
                      dist/*.zip
                      dist/*.tar.gz
                  if-no-files-found: warn

            - name: Upload AppImage artifact
              if: ${{ inputs.upload_artifacts && (matrix.target.os == 'ubuntu-latest' || matrix.target.os == 'ubuntu-24.04-arm') }}
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: SISR-${{ matrix.target.name }}-AppImage${{ inputs.artifact_suffix }}
                  path: dist/appimage/*.AppImage
                  if-no-files-found: warn

            - name: Run tests
              run: just test